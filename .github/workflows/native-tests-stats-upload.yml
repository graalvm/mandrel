name: Native tests stats upload

on:
  workflow_call:
    inputs:
      artifacts-suffix:
        type: string
        description: 'The stats artifact suffix to download'
        default: "null"
      build-stats-tag:
        type: string
        description: 'The tag to use for build stats upload of native tests (e.g. 22.3.0-dev-jdk17-mytest-patch-before)'
        default: "null"
    secrets:
      UPLOAD_COLLECTOR_TOKEN:
        description: 'A token used to report build statistics to a collector'
        required: false

jobs:
  native-tests-stats-upload:
    name: Upload build stats to collector
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: graalvm/mandrel
          fetch-depth: 1
          path: workflow-mandrel
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-stats-*-${{ inputs.artifacts-suffix }}
          path: .
      - name: Extract and import build stats
        env:
          BUILD_STATS_TAG: ${{ inputs.build-stats-tag }}
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_COLLECTOR_TOKEN }}
          COLLECTOR_URL: https://collector.foci.life/api/v1/image-stats
        shell: bash
        run: |
          # In actions/download-artifact@v8 and later when the pattern
          # matches exactly ONE artifact it downloads the artifact
          # contents directly into the destination directory rather than
          # creating a per-artifact sub-directory.  Multiple matches
          # still create sub-directories.  We therefore look for
          # tarballs in both locations so the script works regardless of
          # how many test categories produced stats.
          IMPORT_SCRIPT=$(realpath ./workflow-mandrel/.github/import_stats.sh)
          shopt -s nullglob
          tarballs=(./build-stats-*/build-stats.tgz)
          if [ -f ./build-stats.tgz ]; then
            tarballs+=(./build-stats.tgz)
          fi
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "::warning::No build-stats artifacts found, nothing to upload"
            exit 0
          fi
          echo "Tag for stat upload is going to be: '${BUILD_STATS_TAG}'"
          echo "Processing ${#tarballs[@]} build-stats tarball(s)"
          for tarball in "${tarballs[@]}"; do
            echo "Processing $(realpath "$tarball")"
            workdir=$(mktemp -d)
            tar -xvf "$(realpath "$tarball")" -C "$workdir"
            (
              cd "$workdir"
              DIR=quarkus TAG="${BUILD_STATS_TAG}" TOKEN="${UPLOAD_TOKEN}" URL="${COLLECTOR_URL}" bash "${IMPORT_SCRIPT}"
            )
            rm -rf "$workdir"
          done
