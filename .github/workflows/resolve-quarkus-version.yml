name: Resolve Quarkus Version

on:
  workflow_call:
    inputs:
      quarkus-version:
        type: string
        description: 'Quarkus version (branch, tag, commit, or "latest")'
        required: true
      quarkus-repo:
        type: string
        description: 'Quarkus repository'
        required: true
      os-filter:
        type: string
        description: 'OS filter for test matrix (e.g., "ubuntu", "windows")'
        required: true
      workflow-inputs:
        type: string
        description: 'JSON string of all workflow inputs for artifact suffix generation'
        required: true
    outputs:
      quarkus-version:
        description: 'Resolved Quarkus version (commit SHA or release version)'
        value: ${{ jobs.resolve.outputs.version }}
      tests-matrix:
        description: 'Test matrix JSON'
        value: ${{ jobs.resolve.outputs.test-matrix }}
      artifacts-suffix:
        description: 'Artifact naming suffix'
        value: ${{ jobs.resolve.outputs.artifacts-suffix }}

jobs:
  resolve:
    name: Resolve Version and Generate Matrix
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      test-matrix: ${{ steps.matrix.outputs.test-matrix }}
      artifacts-suffix: ${{ steps.suffix.outputs.suffix }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Log inputs
        run: |
          echo "Inputs:"
          echo '${{ inputs.workflow-inputs }}' | jq . | tr -d '"' | sed 's/,$//g'
      
      - name: Dump inputs to GITHUB_STEP_SUMMARY in markdown table format
        run: |
          echo "## Inputs" >> $GITHUB_STEP_SUMMARY
          echo "| Input | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo '${{ inputs.workflow-inputs }}' | jq -r 'to_entries[] | "| \(.key) | `\(.value)` |"' >> $GITHUB_STEP_SUMMARY
      
      - name: Get Quarkus version
        id: resolve
        run: |
          if [ ${{ inputs.quarkus-version }} == "latest" ]
          then
            export QUARKUS_VERSION=$(curl -s https://repo1.maven.org/maven2/io/quarkus/quarkus-bom/maven-metadata.xml | awk -F"[<>]" '/Final/ {print $3}' | sort -V | tail -n 1)
          elif $(expr match "${{ inputs.quarkus-version }}" "^.*\.\(Final\|CR\|Alpha\|Beta\)[0-9]\?$" > /dev/null)
          then
            export QUARKUS_VERSION=${{ inputs.quarkus-version }}
          elif ! [[ "${{ inputs.quarkus-version }}" =~ ^[0-9a-f]{40}$ ]];
          then
            sha=$(gh api repos/${{ inputs.quarkus-repo }}/commits/${{ inputs.quarkus-version }} --jq .sha || echo "")
            if [ "$sha" != "" ]; then
              export QUARKUS_VERSION=$sha
            else
              export QUARKUS_VERSION=$(git ls-remote ${GITHUB_SERVER_URL}/${{ inputs.quarkus-repo }} | grep "refs/heads/${{ inputs.quarkus-version }}$\|refs/tags/${{ inputs.quarkus-version }}$" | cut -f 1)
            fi
          fi
          if [ "$QUARKUS_VERSION" == "" ]
          then
            export QUARKUS_VERSION=${{ inputs.quarkus-version }}
          fi
          echo ${QUARKUS_VERSION}
          echo "version=${QUARKUS_VERSION}" >> $GITHUB_OUTPUT
          echo "**Quarkus version:** [${QUARKUS_VERSION}](${GITHUB_SERVER_URL}/${{ inputs.quarkus-repo }}/commits/${QUARKUS_VERSION})" >> $GITHUB_STEP_SUMMARY
      
      - name: Get test matrix
        id: matrix
        run: |
          curl --output native-tests.json https://raw.githubusercontent.com/${{ inputs.quarkus-repo }}/${{ steps.resolve.outputs.version }}/.github/native-tests.json
          tests_json=$(jq -c --arg os "${{ inputs.os-filter }}" '.include |= map(select(.["os-name"] | startswith($os)))' native-tests.json)
          echo ${tests_json}
          echo "test-matrix=${tests_json}" >> $GITHUB_OUTPUT
          echo "<details>" >> $GITHUB_STEP_SUMMARY
          echo "<summary>Test matrix:</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          jq --arg os "${{ inputs.os-filter }}" '.include |= map(select(.["os-name"] | startswith($os)))' native-tests.json | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
      
      - name: Generate artifact suffix
        id: suffix
        run: |
          # Build a suffix from inputs but ensure it's safe and has an upper bound on its length (200 characters).
          SUFFIX_RAW=$(echo '${{ inputs.workflow-inputs }}' | jq -j 'del(."build-stats-tag", ."mandrel-it-issue-number", ."issue-repo", ."issue-number") | to_entries[] | "-\(.value)"')
          # Replace characters that are unsafe for artifact names with '-'
          SUFFIX_CLEAN=$(echo "$SUFFIX_RAW" | tr '":<>|*?\r\n\/' '-' | tr -s '-')
          # If the cleaned suffix is reasonably short, use it. Otherwise, create a short stable suffix
          # using the run id and a short hash to guarantee length < 256.
          MAX_LEN=200
          if [ $(echo -n "$SUFFIX_CLEAN" | wc -c) -le $MAX_LEN ]; then
            SUFFIX="$SUFFIX_CLEAN"
          else
            HASH=$(echo -n "$SUFFIX_CLEAN" | sha1sum | cut -c1-40)
            SUFFIX="-run${GITHUB_RUN_ID}-${HASH}"
          fi
          echo "$SUFFIX"
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "**artifacts-suffix:** ${SUFFIX}" >> $GITHUB_STEP_SUMMARY
