# Integration test of CDT with Inspector backend.
name: Weekly CDT Inspector

on:
  schedule:
    - cron: "30 2 * * 2,5" # Tuesday and Friday at 2:30
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cdt-inspect.yml'

env:
  JAVA_HOME: ${{ github.workspace }}/jdk
  JDK_VERSION: "25"
  MX_PATH: ${{ github.workspace }}/mx
  SE_SKIP_DRIVER_IN_PATH: "true"

jobs:
  build:

    runs-on: ubuntu-latest
    #####################
    ## DISABLED until https://github.com/oracle/graaljs/issues/1056
    #####################
    if: false
    #if: github.repository == 'graalvm/graalvm-community-jdk25u'

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: ${{ github.workspace }}/graal
    - name: Checkout oracle/graaljs
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: oracle/graaljs
        ref: 'release/graal-vm/25.0'
        sparse-checkout: |
          graal-js
          benchmarks
        path: ${{ github.workspace }}/js
    - name: Checkout graalvm/mx
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: graalvm/mx.git
        ref: master
        path: ${{ env.MX_PATH }}
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.8'
    - name: Get OpenJDK with static libs and jmods
      uses: ./graal/.github/actions/get-openjdk
      with:
        java-version: ${{ env.JDK_VERSION }}
        java-home: ${{ env.JAVA_HOME }}
        release-type: 'ea'
    - name: Build and Test
      run: |
        cd ${{ github.workspace }}/graal/vm
        ${MX_PATH}/mx --dy /tools,graal-js build
        cd tests/gh_workflows/CDTInspectorTest
        mvn -q compile
        mvn -q exec:exec -Dtestargs="${{ github.workspace }}/graal/sdk/latest_graalvm_home/bin/js scripts/StepTest.js"
